name: Verify tutorial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      semantic:
        description: Also download the CPU embedding model and run semantic search
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: docker compose --profile ui config --quiet

  milvus-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: docker compose pull
      - run: docker compose up -d --wait --wait-timeout 300
      - run: python examples/01_connect.py
      - run: python tests/integration_smoke.py --run
      - name: Repeat the example against its existing collection
        run: python tests/integration_smoke.py --run
      - name: Install optional CPU model dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.semantic
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-semantic.txt
      - name: Run semantic retrieval and evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.semantic
        run: |
          python examples/03_semantic_search.py
          python examples/04_evaluate.py --k 3
      - name: Show service diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail 120
      - name: Stop this ephemeral runner's tutorial services
        if: always()
        run: docker compose down
