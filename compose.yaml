# Local learning deployment, adapted from the Milvus v3.0.1 release asset.
# Source and changes are documented in docs/05-sources-and-validation.md.
name: milvus-tutorial
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ':9001'
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  standalone:
    image: milvusdb/milvus:v3.0.1
    command: [milvus, run, standalone]
    # Kept from the official release asset; evaluate a narrower profile for production.
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - '127.0.0.1:19530:19530'
      - '127.0.0.1:9091:9091'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9091/healthz']
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 20
    logging: *logging

  attu:
    image: zilliz/attu:v3.0.0
    profiles: [ui]
    environment:
      MILVUS_ADDRESS: standalone:19530
      MILVUS_NAME: Tutorial-local
    ports:
      - '127.0.0.1:8000:3000'
    volumes:
      - attu-data:/data
    depends_on:
      standalone:
        condition: service_healthy
    logging: *logging

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  attu-data:
